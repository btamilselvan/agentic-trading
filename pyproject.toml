[project]
name = "agentic-trading"
version = "0.1.0"
description = "Autonomous Robinhood intraday momentum trader (FastAPI + LLM decision engine)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apscheduler>=3.11",
    "httpx>=0.27",
    "robin-stocks>=3.4",
    "mcp>=2.0",
    "httpx2>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Integration tests share one lru_cached AsyncEngine (see state/db.py) across the
# whole test session -- it must be bound to a single event loop for asyncpg's
# connection pool to stay valid, so the default per-test loop scope won't work here.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
