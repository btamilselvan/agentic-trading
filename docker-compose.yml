# Supabase (Postgres) is remote/hosted, so it is not part of this compose file --
# point DATABASE_URL in .env at your Supabase connection string.
services:
  app:
    build: .
    env_file: .env
    environment:
      # Overrides .env's OLLAMA_HOST=http://localhost:11434 -- inside this network,
      # "localhost" is the app container itself, not the ollama service.
      OLLAMA_HOST: http://ollama:11434
      # Same reasoning for Redis (Phase 3 stateful decision engine) -- overrides
      # .env's REDIS_URL=redis://localhost:6379/0.
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./.secrets:/app/.secrets
    depends_on:
      - ollama
      - redis

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  ollama_data:
  redis_data:
